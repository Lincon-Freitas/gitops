apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-operator
  namespace: argocd
spec:
  project: default
  sources:
  - chart: openclaw-operator
    repoURL: oci://ghcr.io/openclaw-rocks/charts/openclaw-operator
    targetRevision: 0.29.0
    helm:
      releaseName: openclaw-operator
      valueFiles:
      - $values/apps/openclaw-operator/values.yaml

  - repoURL: https://github.com/Lincon-Freitas/gitops
    targetRevision: feat/basic-configs
    ref: values

  destination:
    namespace: openclaw-operator-system
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true