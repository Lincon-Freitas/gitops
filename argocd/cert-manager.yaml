apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  sources:
  - chart: cert-manager
    repoURL: oci://quay.io/jetstack/charts/cert-manager
    targetRevision: v1.20.0
    helm:
      releaseName: cert-manager
      valueFiles:
      - $values/apps/cert-manager/values.yaml

  - repoURL: https://github.com/Lincon-Freitas/gitops
    targetRevision: feat/basic-configs
    ref: values

  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true