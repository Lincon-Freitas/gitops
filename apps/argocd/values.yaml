repoServer:
  volumes:
    - name: cmp-plugin
      configMap:
        name: argocd-cmp-cm
    - name: cmp-tmp
      emptyDir: {}

  extraContainers:
    - name: env-to-external-secret
      command: [/var/run/argocd/argocd-cmp-server]
      image: alpine:3
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: cmp-plugin
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: env-to-external-secret.yaml
        - name: cmp-tmp
          mountPath: /tmp
