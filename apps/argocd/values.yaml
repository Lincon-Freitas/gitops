---
crds:
  install: true
  keep: true

logging:
  format: json
  level: info

server:
  extensions:
    enabled: true
  httproute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
    hostnames:
      - argocd.apps.127.0.0.1.nip.io
configs:
  cm:
    admin.enabled: false
  params:
    server.insecure: true
    server.disable.auth: true
